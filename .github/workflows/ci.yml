name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Flink Job
        run: cd flink-job && mvn clean package -DskipTests -B
      - name: Run Java Tests
        run: cd flink-job && mvn test -B

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r producer/requirements.txt -r consumer/requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-java, test-python]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: docker compose build
      - name: Verify containers start
        run: |
          docker compose up -d kafka
          sleep 30
          docker compose ps
          docker compose down -v

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Format Check
        run: cd terraform && terraform fmt -check -recursive
      - name: Terraform Init
        run: cd terraform && terraform init -backend=false
      - name: Terraform Validate
        run: cd terraform && terraform validate
