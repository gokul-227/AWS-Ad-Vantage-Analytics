# ============================================================
# Ad Analytics Streaming Pipeline - Docker Compose
# ============================================================
# Start everything: docker compose up --build
# Stop everything:  docker compose down -v
# ============================================================

services:
  # ==========================================================
  # KAFKA (KRaft mode - Confluent)
  # ==========================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - analytics-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ==========================================================
  # KAFKA TOPIC INITIALIZATION
  # ==========================================================
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      /bin/bash <<EOF
      echo '=== Creating Kafka Topics ==='
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic views-topic --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic clicks-topic --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic metrics-topic --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic dead-letter-topic --partitions 1 --replication-factor 1
      echo '=== Topics Created ==='
      kafka-topics --bootstrap-server kafka:9092 --list
      EOF
    networks:
      - analytics-net

  # ==========================================================
  # FLINK JOB MANAGER (Master)
  # ==========================================================
  jobmanager:
    build:
      context: .
      dockerfile: flink-job/Dockerfile
    container_name: flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - FLINK_PARALLELISM=2
      - FLINK_CHECKPOINT_INTERVAL=60000
      - FLINK_WATERMARK_DELAY_SECONDS=10
      - FLINK_JOIN_WINDOW_SECONDS=30
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        jobmanager.rpc.port: 6123
        jobmanager.memory.process.size: 1024m
        state.backend: hashmap
        state.checkpoints.dir: file:///opt/flink/checkpoints
        rest.flamegraph.enabled: true
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
    networks:
      - analytics-net
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/overview || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ==========================================================
  # FLINK TASK MANAGER (Worker)
  # ==========================================================
  taskmanager:
    build:
      context: .
      dockerfile: flink-job/Dockerfile
    container_name: flink-taskmanager
    command: taskmanager
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - FLINK_JOIN_WINDOW_SECONDS=30
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        jobmanager.rpc.port: 6123
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 1536m
        state.backend: hashmap
        state.checkpoints.dir: file:///opt/flink/checkpoints
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
    networks:
      - analytics-net
    depends_on:
      - jobmanager

  # ==========================================================
  # FLINK JOB SUBMITTER
  # ==========================================================
  flink-job-submit:
    build:
      context: .
      dockerfile: flink-job/Dockerfile
    container_name: flink-job-submit
    command: |
      bash -c "
      echo 'Waiting for Flink JobManager...'
      until curl -sf http://jobmanager:8081/overview > /dev/null 2>&1; do
        echo 'JobManager not ready, waiting...'
        sleep 5
      done
      echo 'Submitting Flink job...'
      /opt/flink/bin/flink run -d -m jobmanager:8081 /opt/flink/usrlib/ad-analytics.jar
      echo 'Job submitted!'
      "
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - FLINK_PARALLELISM=2
      - FLINK_CHECKPOINT_INTERVAL=60000
      - FLINK_WATERMARK_DELAY_SECONDS=10
      - FLINK_JOIN_WINDOW_SECONDS=30
    networks:
      - analytics-net
    depends_on:
      jobmanager:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # ==========================================================
  # EVENT PRODUCER (Python)
  # ==========================================================
  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: producer
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_VIEWS_TOPIC=views-topic
      - KAFKA_CLICKS_TOPIC=clicks-topic
      - PRODUCER_MODE=csv
      - PRODUCER_SPEED_MULTIPLIER=10
      - PRODUCER_DELAY_MS=100
      - VIEWS_CSV_PATH=/data/views.csv
      - CLICKS_CSV_PATH=/data/clicks.csv
    volumes:
      - ./data:/data:ro
    networks:
      - analytics-net
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure

  # ==========================================================
  # METRICS CONSUMER (Python)
  # ==========================================================
  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    container_name: consumer
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_METRICS_TOPIC=metrics-topic
      - CONSUMER_OUTPUT_FILE=/app/metrics_log.json
      - CONSUMER_PRETTY_PRINT=true
    networks:
      - analytics-net
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure

  # ==========================================================
  # KAFKA UI (Web Interface)
  # ==========================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    networks:
      - analytics-net
    depends_on:
      kafka:
        condition: service_healthy

# ==========================================================
# VOLUMES & NETWORKS
# ==========================================================
volumes:
  kafka_data:
    driver: local
  flink_checkpoints:
    driver: local

networks:
  analytics-net:
    driver: bridge
    name: ad-analytics-network
